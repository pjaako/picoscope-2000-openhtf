[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "picoscope-2000-openhtf"
version = "0.1.0"
description = "OpenHTF plug for PicoScope 2000 Series (A API) USB oscilloscopes"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    "openhtf>=1.6.1,<2",
    "picosdk>=1.1,<2",
    "numpy>=2.0",
]

[dependency-groups]
dev = ["pytest>=8", "mypy>=1.11", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/picoscope_2000_openhtf"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"
# Markdown is excluded: docs/api_reference.md quotes the manual and picosdk verbatim and
# ruff 0.16 would reformat the fenced code blocks.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
files = ["src", "tests", "tools"]

[[tool.mypy.overrides]]
module = ["openhtf", "openhtf.*", "picosdk", "picosdk.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*", "example_test"]
disallow_untyped_decorators = false
